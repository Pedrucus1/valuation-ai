[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m ensurepip --upgrade && python3 -m pip install -r backend/requirements.txt",
  "cd 'Modulo Drive IA' && npm install --omit=dev 2>/dev/null || true"
]

[start]
cmd = "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
